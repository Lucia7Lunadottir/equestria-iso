#
# Create, overwrite or update /etc/default/grub in the target system.
---

overwrite: false

prefer_grub_d: false

keepDistributor: true


# quiet нужно задать здесь: из существующей строки grubcfg его выбрасывает
# (как и splash — но splash модуль возвращает сам, когда находит plymouth)
kernel_params: [ "quiet" ]
