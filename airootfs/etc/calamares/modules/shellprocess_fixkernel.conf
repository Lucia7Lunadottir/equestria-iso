dontChroot: true
timeout: 300
script:
    # 1. Удаляем linux.preset чтобы initcpio не пытался его собирать
    - "-rm -f ${ROOT}/etc/mkinitcpio.d/linux.preset"

    # 2. Удаляем archiso-специфичные конфиги mkinitcpio
    - "-rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - "-sed -i 's/archiso/default/g' ${ROOT}/etc/mkinitcpio.d/linux-lts.preset"
    - "-sed -i 's|/etc/mkinitcpio.conf.d/default.conf|/etc/mkinitcpio.conf|g' ${ROOT}/etc/mkinitcpio.d/linux-lts.preset"

    # 3. Копируем ядро на место (только linux-lts, директория содержит '-lts')
    - "-chattr +m ${ROOT}/boot"
    #    Пишем ядро заново целиком: unpackfs копирует через rsync -S, и нулевые последние
    #    512 байт ядра становятся дырой. На Btrfs (no-holes) у дыры нет записи, GRUB
    #    дочитывает файл не до конца: "premature end of file". install/cp по умолчанию
    #    делают reflink и переносят дыру в копию, поэтому --reflink=never --sparse=never.
    #    Исходник в /usr/lib/modules тоже переписываем: хук mkinitcpio снова копирует
    #    ядро оттуда, когда pg-gpu-sync ставит драйверы.
    #    Без shell-переменных: Calamares сам подставляет всё вида $имя и падает на незнакомых.
    - "find ${ROOT}/usr/lib/modules -maxdepth 2 -path '*-lts/vmlinuz' -exec cp -p --reflink=never --sparse=never {} {}.dense \\;"
    - "find ${ROOT}/usr/lib/modules -maxdepth 2 -path '*-lts/vmlinuz.dense' -execdir mv -f vmlinuz.dense vmlinuz \\;"
    - "find ${ROOT}/usr/lib/modules -maxdepth 2 -path '*-lts/vmlinuz' -exec cp --reflink=never --sparse=never {} ${ROOT}/boot/vmlinuz-linux-lts \\;"
    - "-chmod 644 ${ROOT}/boot/vmlinuz-linux-lts"
    - "-sync"

    # 4. Удаляем пакет linux (обычное ядро — в системе нужен только lts)
    - "-pacman --root ${ROOT} -Rns --noconfirm linux linux-headers"

    # 5. Удаляем пакеты специфичные для live-окружения и сам установщик
    - "-pacman --root ${ROOT} -Rns --noconfirm mkinitcpio-archiso calamares"

i18n:
     name: "Fixing kernel configuration..."
