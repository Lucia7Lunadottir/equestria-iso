---
# Среда восстановления Equestria OS: тот же ISO, с которого идёт установка, кладётся в
# новую систему (/var/lib/equestria-recovery), и в меню GRUB появляется пункт
# «Восстановление Equestria OS» — флешка для починки больше не нужна, скачивать ничего не надо.
#
# Выполняется в live-среде (не в chroot): читает флешку или ISO-файл, копирует (~5,5 ГБ),
# сверяет контрольную сумму системы внутри образа и уже в chroot записывает пункт GRUB.
# Поэтому шаг стоит после installgrub (grub.cfg уже есть).
# Любая неудача (мало места, носитель не найден) установку не прерывает — тогда образ
# можно скачать позже в «Восстановление системы».
dontChroot: true
timeout: 1800
script:
    - "-/usr/bin/equestria-recovery-backend import-live --root ${ROOT}"

i18n:
    name: "Copying the recovery environment..."
